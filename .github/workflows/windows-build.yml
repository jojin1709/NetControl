# NetControl CI — MSVC via Ninja (no dependency on a specific VS generator/version)
# Push to main → build + test + publish NetControl.exe to the "latest" release.
name: windows-build

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetControl
          path: build/NetControl.exe

      - name: Publish to release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES="Automated build ${SHORT_SHA} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest build/NetControl.exe --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest build/NetControl.exe \
              --title "NetControl (latest build)" \
              --notes "$NOTES" --latest
          fi
